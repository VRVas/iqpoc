name: Azure Static Web Apps CI/CD (Zava)

# Deploys the Zava-tenant build of the Next.js app to the Zava SWA.
# Trigger is intentionally limited to the `generic-zava` branch ONLY so this
# workflow never overlaps with the Qatar workflow (which runs on `main`).
on:
  push:
    branches:
      - generic-zava

jobs:
  build_and_deploy_zava:
    runs-on: ubuntu-latest
    name: Build and Deploy Zava SWA
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZAVA }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: ".next"
        env:
          # Bake tenant identity into client bundle at build time.
          # Runtime server env vars (TENANT_ID, FOUNDRY_*, COSMOS_*, etc.) come
          # from SWA app settings configured via `az staticwebapp appsettings set`.
          NEXT_PUBLIC_TENANT_ID: zava
